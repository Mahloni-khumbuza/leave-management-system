spring:
  application:
    name: leave-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leave_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-bytes-required-aaaaaaa}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      dir: ${LOCAL_UPLOAD_DIR:uploads}
      public-base-url: ${LOCAL_UPLOAD_BASE_URL:http://localhost:8080/uploads}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:leave-mgmt-uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
